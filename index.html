<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thủy Văn Dashboard - Tối Ưu Không Gian</title>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
	<link rel="apple-touch-icon" href="icon.png">
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, Arial, sans-serif; margin: 0; padding: 8px; background: #f4f6f9; color: #333; }
        .container { max-width: 1200px; margin: 0 auto; background: white; padding: 12px; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,0.05); }
        h2 { color: #1a365d; border-bottom: 2px solid #2b6cb0; padding-bottom: 5px; font-size: 1.25rem; margin: 0 0 10px 0; }
        .control-panel { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; margin-bottom: 10px; background: #f8fafc; padding: 8px; border-radius: 6px; border: 1px solid #e2e8f0; align-items: center; }
        .form-group { display: flex; flex-direction: column; }
        .form-group label { font-weight: bold; margin-bottom: 3px; font-size: 11px; color: #4a5568; }
        .form-group select { padding: 6px; border: 1px solid #cbd5e0; border-radius: 4px; font-size: 13px; background: white; }
        .btn-group { display: flex; gap: 8px; margin-bottom: 15px; flex-wrap: wrap; }
        button { flex: 1; min-width: 150px; padding: 10px 15px; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; color: white; font-size: 13px; transition: all 0.2s; }
        .btn-sync { background: #3182ce; } .btn-sync:hover { background: #2b6cb0; }
        .btn-excel { background: #2f855a; } .btn-excel:hover { background: #22543d; }
        .chart-container { position: relative; margin-bottom: 15px; padding: 10px; background: #fff; border: 1px solid #e2e8f0; border-radius: 6px; height: 380px; }
        .table-responsive { width: 100%; overflow-x: auto; -webkit-overflow-scrolling: touch; border: 1px solid #e2e8f0; border-radius: 6px; }
        table { width: 100%; border-collapse: collapse; min-width: 700px; font-size: 13px; }
        th, td { border: 1px solid #e2e8f0; padding: 8px 6px; text-align: center; }
        th { background: #1a365d; color: white; font-weight: 600; }
        .station-header-5 { background: #2c5282; } .station-header-4 { background: #2b6cb0; }
        tr:nth-child(even) { background: #f7fafc; } tr:hover { background: #edf2f7; }
    </style>
</head>
<body>

<div class="container">
    <h2>📊 MỰC NƯỚC, LƯU LƯỢNG NƯỚC TRUNG BÌNH NGÀY (Trạm Tân Châu và Châu Đốc)</h2>
    
    <div class="control-panel">
        <div class="form-group">
            <select id="chartMetric" onchange="updateChartData()">
                <option value="Q">Lưu lượng trung bình Q_TB (2 Trục Tọa Độ)</option>
                <option value="H">Mực nước trung bình H_TB (cm)</option>
            </select>
        </div>
    </div>

    <div class="btn-group">
        <button class="btn-sync" onclick="loadAndProcessData()">🔄 Tải Dữ Liệu 20 Ngày Mới Nhất & Vẽ Đồ Thị</button>
        <button class="btn-excel" onclick="exportToExcel()">📊 Xuất File EXCEL</button>
    </div>

    <div class="chart-container">
        <canvas id="hydrologyChart"></canvas>
    </div>

    <div class="table-responsive">
        <table id="dataTable">
            <thead>
                <tr>
                    <th rowspan="2" style="vertical-align: middle;">NGÀY (YYYY-MM-DD)</th>
                    <th colspan="2" class="station-header-5">TRẠM TÂN CHÂU</th>
                    <th colspan="2" class="station-header-4">TRẠM CHÂU ĐỐC</th>
                </tr>
                <tr>
                    <th class="station-header-5">H_TB (cm)</th>
                    <th class="station-header-5">Q_TB (m³/s)</th>
                    <th class="station-header-4">H_TB (cm)</th>
                    <th class="station-header-4">Q_TB (m³/s)</th>
                </tr>
            </thead>
            <tbody id="dataBody">
                <tr><td colspan="5" style="color:#718096; padding: 15px;">Vui lòng nhấn nút để hiển thị dữ liệu thủy văn...</td></tr>
            </tbody>
        </table>
    </div>
</div>

<script>
let mergedDataReport = []; 
let myChart = null; 

function formatDateString(date) {
    const year = date.getFullYear();
    const month = String(date.getMonth() + 1).padStart(2, '0');
    const day = String(date.getDate()).padStart(2, '0');
    return `${year}-${month}-${day}`;
}

async function loadAndProcessData() {
    let apiEndpoint = "http://103.82.27.28:8000"; 
    const tbody = document.getElementById("dataBody");
    
    const today = new Date(); 
    const twentyDaysAgo = new Date();
    twentyDaysAgo.setDate(today.getDate() - 19); 

    const fromDate = formatDateString(twentyDaysAgo);
    const toDate = formatDateString(today);

    if (apiEndpoint.endsWith('/')) {
        apiEndpoint = apiEndpoint.slice(0, -1);
    }

    tbody.innerHTML = `<tr><td colspan="5" style="color:#3182ce; font-weight:bold; padding: 15px;">🔄 Đang đồng bộ dữ liệu trạm triều zero từ ${fromDate} đến ${toDate}...</td></tr>`;

    try {
        const urlStation5 = `${apiEndpoint}/api/tideDailyStats?source_id=5&from_date=${fromDate}&to_date=${toDate}`;
        const urlStation4 = `${apiEndpoint}/api/tideDailyStats?source_id=4&from_date=${fromDate}&to_date=${toDate}`;

        const [res5, res4] = await Promise.all([
		    fetch(urlStation5)
		        .then(r => r.ok ? r.json() : [])
		        .catch(err => { console.warn("⚠️ Lỗi trạm 5:", err); return []; }),
		
		    fetch(urlStation4)
		        .then(r => r.ok ? r.json() : [])
		        .catch(err => { console.warn("⚠️ Lỗi trạm 4:", err); return []; })
		]);

        if (!res5.success || !res4.success) {
            const errLog = (!res5.success ? res5.error : "") + " " + (!res4.success ? res4.error : "");
            tbody.innerHTML = `<tr><td colspan="5" style="color:#e53e3e; font-weight:bold;">❌ Lỗi: ${errLog}</td></tr>`;
            return;
        }

        const mergeMap = new Map();

        res5.data.forEach(item => {
            const dateKey = item.Ngay.split("T")[0];
            mergeMap.set(dateKey, { Ngay: dateKey, H5: item.H_TrungBinh, Q5: item.Q_TrungBinh, H4: "-", Q4: "-" });
        });

        res4.data.forEach(item => {
            const dateKey = item.Ngay.split("T")[0];
            if (mergeMap.has(dateKey)) {
                const existing = mergeMap.get(dateKey);
                existing.H4 = item.H_TrungBinh;
                existing.Q4 = item.Q_TrungBinh;
            } else {
                mergeMap.set(dateKey, { Ngay: dateKey, H5: "-", Q5: "-", H4: item.H_TrungBinh, Q4: item.Q_TrungBinh });
            }
        });

        mergedDataReport = Array.from(mergeMap.values()).sort((a, b) => a.Ngay.localeCompare(b.Ngay));
        tbody.innerHTML = ""; 

        if (mergedDataReport.length === 0) {
            tbody.innerHTML = `<tr><td colspan="5" style="color:#dd6b20; padding: 15px;">⚠️ Không tìm thấy dữ liệu.</td></tr>`;
            if(myChart) myChart.destroy();
            return;
        }

        mergedDataReport.forEach(item => {
            const row = `<tr>
                <td><strong>${item.Ngay}</strong></td>
                <td style="color: #2b6cb0; font-weight: bold;">${item.H5}</td>
                <td style="color: #2f855a; font-weight: bold;">${item.Q5}</td>
                <td style="color: #4299e1; font-weight: bold;">${item.H4}</td>
                <td style="color: #4a5568; font-weight: bold;">${item.Q4}</td>
            </tr>`;
            tbody.innerHTML += row;
        });

        updateChartData();

    } catch (error) {
        tbody.innerHTML = `<tr><td colspan="5" style="color:#e53e3e; font-weight:bold; padding: 15px;">❌ Lỗi kết nối API: ${error.message}</td></tr>`;
    }
}

function updateChartData() {
    if (mergedDataReport.length === 0) return;

    const metricType = document.getElementById("chartMetric").value;
    const labels = mergedDataReport.map(item => item.Ngay);
    
    let dataTC = [], dataCD = [];
    let chartOptions = {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
            legend: { position: 'top', labels: { font: { weight: 'bold', size: 11 } } }
        },
        scales: {
            x: { grid: { display: false }, ticks: { font: { size: 10 } } }
        }
    };

    let datasets = [];

    if (metricType === "Q") {
        dataTC = mergedDataReport.map(item => item.Q5 === "-" ? null : item.Q5);
        dataCD = mergedDataReport.map(item => item.Q4 === "-" ? null : item.Q4);

        const validTC = dataTC.filter(v => v !== null);
        const validCD = dataCD.filter(v => v !== null);

        const maxTC = validTC.length ? Math.max(...validTC) : 1000;
        const maxCD = validCD.length ? Math.max(...validCD) : 500;

        datasets = [
            {
                label: "Tân Châu - Q_TB (m³/s) [Trục Trái]",
                data: dataTC,
                borderColor: '#2b6cb0',
                backgroundColor: 'rgba(43, 108, 176, 0.03)',
                borderWidth: 2,
                tension: 0.15,
                yAxisID: 'y_tanchau',
                spanGaps: true
            },
            {
                label: "Châu Đốc - Q_TB (m³/s) [Trục Phải]",
                data: dataCD,
                borderColor: '#e53e3e',
                backgroundColor: 'rgba(229, 62, 62, 0.03)',
                borderWidth: 2,
                tension: 0.15,
                yAxisID: 'y_chaudoc',
                spanGaps: true
            }
        ];

        chartOptions.scales.y_tanchau = {
            type: 'linear',
            display: true,
            position: 'left',
            min: 0,
            max: Math.ceil(maxTC * 1.2),
            title: { display: true, text: 'Q Tân Châu', color: '#2b6cb0', font: { weight: 'bold', size: 11 } },
            ticks: { color: '#2b6cb0', font: { weight: 'bold', size: 10 } }
        };

        chartOptions.scales.y_chaudoc = {
            type: 'linear',
            display: true,
            position: 'right',
            min: 0,
            max: Math.ceil(maxCD * 2.2),
            title: { display: true, text: 'Q Châu Đốc', color: '#e53e3e', font: { weight: 'bold', size: 11 } },
            ticks: { color: '#e53e3e', font: { weight: 'bold', size: 10 } },
            grid: { drawOnChartArea: false }
        };

    } else {
        dataTC = mergedDataReport.map(item => item.H5 === "-" ? null : item.H5);
        dataCD = mergedDataReport.map(item => item.H4 === "-" ? null : item.H4);

        datasets = [
            {
                label: "Tân Châu - H_TB (cm)",
                data: dataTC,
                borderColor: '#2b6cb0',
                backgroundColor: 'rgba(43, 108, 176, 0.03)',
                borderWidth: 2,
                tension: 0.15,
                yAxisID: 'y_chung',
                spanGaps: true
            },
            {
                label: "Châu Đốc - H_TB (cm)",
                data: dataCD,
                borderColor: '#e53e3e',
                backgroundColor: 'rgba(229, 62, 62, 0.03)',
                borderWidth: 2,
                tension: 0.15,
                yAxisID: 'y_chung',
                spanGaps: true
            }
        ];

        chartOptions.scales.y_chung = {
            type: 'linear',
            display: true,
            position: 'left',
            title: { display: true, text: 'Mực nước H_TB (cm)', font: { weight: 'bold', size: 11 } },
            ticks: { font: { weight: 'bold', size: 10 } }
        };
    }

    const ctx = document.getElementById('hydrologyChart').getContext('2d');
    if (myChart) { myChart.destroy(); }

    myChart = new Chart(ctx, {
        type: 'line',
        data: { labels: labels, datasets: datasets },
        options: chartOptions
    });
}

function exportToExcel() {
    if (mergedDataReport.length === 0) {
        alert("Không có dữ liệu thủy văn khả dụng để xuất file!");
        return;
    }

    // 1. Tự động lấy ngày giờ hiện tại để đặt tên file
    const bâyGiờ = new Date();
    const năm = bâyGiờ.getFullYear();
    const tháng = String(bâyGiờ.getMonth() + 1).padStart(2, '0');
    const ngày = String(bâyGiờ.getDate()).padStart(2, '0');
    
    // Tạo chuỗi ngày tháng dạng YYYYMMDD (Ví dụ: 20260523)
    const chuỗiNgàyTháng = `${năm}${tháng}${ngày}`;

    const excelRows = mergedDataReport.map(item => ({
        "Ngày (YYYY-MM-DD)": item.Ngay,
        "Tân Châu H TB (cm)": item.H5,
        "Tân Châu Q TB (m3/s)": item.Q5,
        "Châu Đốc H TB (cm)": item.H4,
        "Châu Đốc Q TB (m3/s)": item.Q4
    }));

    const worksheet = XLSX.utils.json_to_sheet(excelRows);
    const workbook = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(workbook, worksheet, "20NgayMoiNhat");

    // 2. Nối chuỗi ngày tháng vào tên file xuất ra
    // Kết quả file sẽ có dạng: BaoCao_20Ngay_MoiNhat_20260523.xlsx
    XLSX.writeFile(workbook, `BaoCao_20Ngay_MoiNhat_${chuỗiNgàyTháng}.xlsx`);
}
</script>

</body>
</html>
